<script>
window.report = function (msg) {
  if (document.getElementById('err')) return;
  var d = document.createElement('div'); d.id = 'err';
  d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99;padding:6px 10px;font:11px/1.4 monospace;color:#ffb3a8;background:rgba(0,0,0,.7);border-radius:6px;pointer-events:none';
  d.textContent = msg;
  (document.body || document.documentElement).appendChild(d);
};
window.addEventListener('error', function (e) {
  report('Script error: ' + (e.message || 'unknown') + (e.lineno ? ' (line ' + e.lineno + ')' : ''));
});
setTimeout(function () {
  var b = document.body; if (!b) return;
  if (!/\bready\b/.test(b.className)) b.className += ' ready';
  if (!/\btitled\b/.test(b.className)) b.className += ' titled';
}, 2500);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{--red:#c8231b;--gold:#e9b949;--ink:#1a1210;--paper:#f4e9d0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:inherit;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:#000;color:var(--ink);font-family:'Rajdhani',system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.layer{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none}

/* ── Gateway: frozen video + blaze ── */
#stage{position:fixed;top:0;right:0;bottom:0;left:0;z-index:0;background:#000;opacity:0;transition:opacity .7s ease;transform-origin:46% 55%;will-change:transform}
#vid{width:100%;height:100%;object-fit:cover;object-position:46% 50%;display:block}
body.ready #stage{opacity:1}
#glow{z-index:1;opacity:.3;background:radial-gradient(ellipse 90% 45% at 50% 108%,rgba(255,90,20,.75),rgba(200,30,10,.35) 45%,transparent 75%)}

/* ── Profile page (revealed through an iris) ── */
#page{position:fixed;top:0;right:0;bottom:0;left:0;z-index:2;background:#fff;clip-path:circle(0px at 50% 50%)}
#bgw{position:absolute;top:0;right:0;bottom:0;left:0;will-change:transform;transform:scale(1.14)}
#bg,#bgb{position:absolute;top:0;right:0;bottom:0;left:0;background:#fff center bottom/cover no-repeat}
#bgb{filter:blur(8px);will-change:opacity}
#ui{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:calc(8vh + 28px) 24px 0;pointer-events:none}
@media(min-aspect-ratio:1/1){
 #bg,#bgb{background-size:auto 100%;-webkit-mask:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);mask:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent)}
 #ui{justify-content:center;padding-top:0}}




#streak{position:fixed;z-index:7;left:-10%;right:-10%;top:50%;height:2px;margin-top:-1px;pointer-events:none;opacity:0;transform:scaleX(0);background:linear-gradient(90deg,transparent,rgba(255,200,120,.9) 30%,#fff 50%,rgba(255,200,120,.9) 70%,transparent);filter:blur(1px);box-shadow:0 0 26px 6px rgba(255,150,50,.6)}
#fx{z-index:4;width:100%;height:100%}
#vig{z-index:5;background:radial-gradient(ellipse at 50% 50%,transparent 35%,rgba(0,0,0,.55) 75%,#000 120%)}
#grain{z-index:6;top:-8%;right:-8%;bottom:-8%;left:-8%;opacity:.07;will-change:transform;animation:grain .9s steps(5) infinite;
background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
@keyframes grain{20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}}
#flash{z-index:7;opacity:0;background:radial-gradient(circle at 50% 50%,#fff,rgba(255,220,160,.7) 40%,transparent 75%)}
.bar{position:fixed;left:0;right:0;height:0;background:#000;z-index:60;transition:height 1.1s cubic-bezier(.7,0,.2,1)}
.bar.t{top:0}.bar.d{bottom:0}
body.cine .bar{height:11vh}

/* ── Title ── */
#intro{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;display:grid;place-items:center;cursor:pointer;outline:0;opacity:0;transition:opacity .8s .15s}
body.titled #intro{opacity:1}
#title{width:min(86vw,500px);overflow:visible;will-change:transform;filter:drop-shadow(0 8px 30px rgba(235,70,20,.6));animation:breathe 3.4s ease-in-out infinite alternate}
#intro::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;margin:auto;width:min(94vw,560px);height:min(62vw,340px);background:radial-gradient(closest-side,rgba(255,100,25,.45),transparent);animation:gl 3.4s ease-in-out infinite alternate;pointer-events:none}
@keyframes gl{from{opacity:.4}to{opacity:1}}
#intro.go::before{animation:none;opacity:0;transition:opacity .4s}
@keyframes breathe{from{transform:rotate(-1.5deg) scale(1)}to{transform:rotate(-.5deg) scale(1.035)}}
#intro.go{pointer-events:none}
#intro.go #title{animation:crush 1.15s cubic-bezier(.5,0,.2,1) forwards}
@keyframes crush{18%{transform:rotate(-1.5deg) scale(.9)}100%{transform:rotate(-3deg) scale(2.6);opacity:0}}

/* ── Profile UI ── */
.rv{opacity:0;transform:translateY(24px) scale(.97);filter:blur(10px);transition:opacity 1.3s var(--d,0s) ease,transform 1.6s var(--d,0s) cubic-bezier(.16,1,.3,1),filter 1.3s var(--d,0s) ease}
body.reveal .rv{opacity:1;transform:none;filter:none;pointer-events:auto}
.avatar{position:relative;width:108px;height:108px;margin-bottom:22px;padding:3px;border-radius:50%;box-shadow:0 8px 30px rgba(120,60,20,.3)}
.avatar::before{content:"";position:absolute;top:-6px;right:-6px;bottom:-6px;left:-6px;border-radius:50%;animation:spin 10s linear infinite;
background:conic-gradient(var(--gold),var(--red),var(--gold),#fff,var(--gold));-webkit-mask:radial-gradient(circle,transparent 62%,#000 64%);mask:radial-gradient(circle,transparent 62%,#000 64%)}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar img,.mono{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;border:2px solid #fff;background:var(--paper);position:relative}
.mono{font:400 52px 'Pirata One',serif;color:var(--ink)}
.hat{position:absolute;left:50%;top:-34px;width:92px;z-index:2;transform:translateX(-50%) rotate(-10deg);filter:drop-shadow(0 4px 5px rgba(0,0,0,.35))}
.name{font:400 clamp(46px,13vw,64px)/1 'Pirata One',serif;letter-spacing:.06em;color:var(--ink);text-shadow:3px 3px 0 var(--red);perspective:600px}
.name span{display:inline-block;opacity:0;transform:translateY(.6em) rotateX(70deg);filter:blur(8px);
transition:opacity 1.1s calc(.45s + var(--i)*.08s),transform 1.4s calc(.45s + var(--i)*.08s) cubic-bezier(.16,1,.3,1),filter 1.1s calc(.45s + var(--i)*.08s)}
body.reveal .name span{opacity:1;transform:none;filter:none}
.tagline{margin:12px 0 22px;font-size:14px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:#5a4640}
.badge{display:flex;align-items:center;gap:9px;margin-bottom:24px;padding:9px 20px;border-radius:6px;font-weight:700;font-size:13px;letter-spacing:.1em;color:var(--paper);background:var(--ink);border:1px solid var(--gold);box-shadow:0 5px 18px rgba(26,18,16,.35);transition:.35s}
.badge:hover{background:#2c1814;box-shadow:0 0 24px rgba(233,185,73,.55)}
.badge svg{color:var(--gold)}
.socials{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.socials a{width:46px;height:46px;display:grid;place-items:center;border-radius:50%;color:var(--ink);background:rgba(255,255,255,.7);border:1px solid rgba(26,18,16,.2);transition:.45s cubic-bezier(.175,.885,.32,1.275)}
.socials a:hover{color:var(--red);border-color:var(--gold);transform:translateY(-5px) scale(1.1);box-shadow:0 8px 18px rgba(200,35,27,.3)}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pill{position:fixed;z-index:20;display:flex;align-items:center;gap:10px;color:var(--paper);background:rgba(26,15,13,.9);border:1px solid rgba(233,185,73,.4);border-radius:8px}
.audio{top:calc(14px + env(safe-area-inset-top,0px));left:16px;padding:6px 14px 6px 10px}
.views{bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;padding:6px 12px;font-size:13px;font-weight:700;letter-spacing:.1em}
.views svg.ic{width:16px;height:16px;color:var(--gold)}
input[type=range]{-webkit-appearance:none;appearance:none;width:64px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(244,233,208,.3);border-radius:1px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;margin-top:-4px;border-radius:50%;background:var(--gold)}
input[type=range]::-moz-range-track{height:2px;background:rgba(244,233,208,.3)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;background:var(--gold)}
.avatar::after{content:"";position:absolute;top:-30px;right:-30px;bottom:-30px;left:-30px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,transparent 52%,rgba(110,8,22,.16) 66%,transparent 74%);animation:aura 5s ease-in-out infinite alternate}
@keyframes aura{from{opacity:.2;transform:scale(.96)}to{opacity:.85;transform:scale(1.07)}}
body.lite #grain,body.lite #bgb{display:none}
@media(prefers-reduced-motion:reduce){#grain,#title,.avatar::before,.avatar::after{animation:none}}
</style>
</head>
