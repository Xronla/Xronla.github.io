<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>xronla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{--red:#c8231b;--gold:#e9b949;--ink:#1a1210;--paper:#f4e9d0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:inherit;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:#000;color:var(--ink);font-family:'Rajdhani',system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.layer{position:fixed;inset:0;pointer-events:none}

/* ── Gateway: frozen video + blaze ── */
#stage{position:fixed;inset:0;z-index:0;background:#000;opacity:0;transition:opacity .7s ease;transform-origin:46% 55%;will-change:transform}
#vid{width:100%;height:100%;object-fit:cover;object-position:46% 50%;display:block}
body.ready #stage{opacity:1}
#glow{z-index:1;opacity:.3;background:radial-gradient(ellipse 90% 45% at 50% 108%,rgba(255,90,20,.75),rgba(200,30,10,.35) 45%,transparent 75%)}

/* ── Profile page (revealed through an iris) ── */
#page{position:fixed;inset:0;z-index:2;background:#fff;clip-path:circle(0px at 50% 50%)}
#bgw{position:absolute;inset:0;will-change:transform;transform:scale(1.14)}
#bg,#bgb{position:absolute;inset:0;background:#fff center bottom/cover no-repeat}
#bgb{filter:blur(8px);will-change:opacity}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:calc(8dvh + 28px) 24px 0;pointer-events:none}
