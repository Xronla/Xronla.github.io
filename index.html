<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@500;700&family=Sedgwick+Ave+Display&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100dvh;
            width: 100dvw;
            overflow: hidden;
            background-color: #030303;
            color: white;
            font-family: 'Rajdhani', sans-serif;
        }

        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100dvw;
            height: 100dvh;
            z-index: 100;
            background-color: #000;
            cursor: pointer;
            overflow: hidden;
            transition: opacity 1.5s ease;
        }

        .sky-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #0a1118 0%, #1a2a3a 50%, #2a3b4c 100%);
            z-index: 1;
        }

        .mountain-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://files.catbox.moe/9xpjl0.jpg');
            background-size: cover;
            background-position: center bottom;
            z-index: 2;
            transition: transform 3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .fog-layer {
            position: absolute;
            bottom: 0;
            left: -50%;
            width: 200%;
            height: 50%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.15;
            z-index: 3;
            animation: fogDrift 25s linear infinite;
            pointer-events: none;
        }

        @keyframes fogDrift {
            0% { transform: translateX(0); }
            100% { transform: translateX(25%); }
        }

        .intro-text-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: transform 2.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 1s ease;
        }

        .intro-text {
            font-family: 'Sedgwick Ave Display', cursive;
            font-size: 45px;
            color: #111;
            letter-spacing: 4px;
            text-transform: uppercase;
            -webkit-text-stroke: 1.5px #fff;
            text-shadow: 4px 4px 0px #8b0000, 6px 6px 0px #000;
            transform: rotate(-3deg);
            animation: textPulse 2s infinite alternate;
            pointer-events: none;
        }

        @keyframes textPulse {
            0% { transform: rotate(-3deg) scale(1); opacity: 0.8; }
            100% { transform: rotate(-2deg) scale(1.05); opacity: 1; }
        }

        .pan-up .mountain-bg {
            transform: translateY(-100%);
        }

        .pan-up .fog-layer {
            transform: translateY(-100%);
            opacity: 0;
            transition: transform 2.5s ease, opacity 2s ease;
        }

        .pan-up .intro-text-container {
            transform: translateY(-100dvh);
            opacity: 0;
        }

        #bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100dvw;
            height: 100dvh;
            background-size: cover;
            background-position: center;
            filter: grayscale(100%) brightness(0.6) contrast(1.1);
            z-index: -3;
            opacity: 0;
            transition: opacity 2s ease;
        }

        #bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100dvw;
            height: 100dvh;
            background: radial-gradient(circle at center, transparent 10%, rgba(0, 0, 0, 0.7) 70%, #000 100%);
            z-index: -2;
            opacity: 0;
            transition: opacity 2s ease;
            pointer-events: none;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100dvw;
            height: 100dvh;
            z-index: -1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            width: 100dvw;
            padding: 20px;
            text-align: center;
            z-index: 1;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 2s ease, transform 2s cubic-bezier(0.19, 1, 0.22, 1);
            pointer-events: none;
        }

        .reveal .container {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .profile-pic-container {
            position: relative;
            margin-bottom: 20px;
            padding: 3px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(139,0,0,0.6), rgba(255,255,255,0.1));
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9), inset 0 0 10px rgba(255, 0, 0, 0.1);
            animation: ringPulse 4s infinite alternate;
        }

        @keyframes ringPulse {
            0% { box-shadow: 0 0 25px rgba(0, 0, 0, 0.9), inset 0 0 10px rgba(255, 0, 0, 0.1); }
            100% { box-shadow: 0 0 35px rgba(100, 0, 0, 0.3), inset 0 0 15px rgba(255, 0, 0, 0.3); }
        }

        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .name {
            font-family: 'Cinzel', serif;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 3px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 1), 0 0 15px rgba(255, 255, 255, 0.1);
            margin-bottom: 6px;
            color: #e5e5e5;
        }

        .tagline {
            font-size: 14px;
            font-weight: 500;
            color: #999;
            margin-bottom: 25px;
            letter-spacing: 1.5px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 1);
        }

        .discord-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(12, 12, 12, 0.5);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 18px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 30px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }

        .discord-badge::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 50, 50, 0.5), transparent);
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }

        .discord-badge:hover::after {
            transform: scaleX(1);
        }

        .discord-badge:hover {
            background: rgba(25, 25, 25, 0.8);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.15);
        }

        .discord-badge i {
            margin-right: 8px;
            color: #5865F2;
            font-size: 16px;
        }

        .social-links {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            margin-top: 5px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 24px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        .social-link img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            transition: transform 0.4s ease, filter 0.4s ease;
        }

        .social-link:hover {
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 0 0 25px rgba(255, 0, 0, 0.4);
            transform: translateY(-5px) scale(1.1);
        }
        
        .social-link:hover img {
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.9)) brightness(1.2);
        }

        .top-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(10, 10, 10, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 14px;
            border-radius: 6px;
            z-index: 10;
            transition: opacity 0.3s;
        }

        .audio-control {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            cursor: pointer;
        }

        .audio-control i {
            width: 16px;
            text-align: center;
            transition: color 0.3s;
        }

        .audio-control:hover i {
            color: #fff;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 60px;
            background: transparent;
            outline: none;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 8px;
            width: 8px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -3px;
            box-shadow: 0 0 8px rgba(255,255,255,0.6);
            transition: transform 0.2s;
        }

        input[type=range]:active::-webkit-slider-thumb {
            transform: scale(1.3);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            cursor: pointer;
            background: rgba(255,255,255,0.15);
            border-radius: 1px;
        }

        .view-counter {
            position: absolute;
            bottom: 25px;
            left: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.4);
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 1px;
        }

        .view-counter i {
            font-size: 15px;
        }

        @media (max-width: 600px) {
            .name { font-size: 26px; }
            .tagline { font-size: 12px; }
            .profile-pic { width: 90px; height: 90px; }
            .social-link { font-size: 22px; }
            .social-link img { width: 22px; height: 22px; }
            .intro-text { font-size: 32px; }
            .top-ui { top: 15px; left: 15px; }
            .view-counter { bottom: 15px; left: 15px; }
            .discord-badge { padding: 6px 14px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div id="intro-screen">
        <div class="sky-bg"></div>
        <div class="mountain-bg"></div>
        <div class="fog-layer"></div>
        <div class="intro-text-container">
            <div class="intro-text">Take me there</div>
        </div>
    </div>

    <div class="top-ui">
        <div class="audio-control" id="audio-toggle">
            <i class="fas fa-volume-up" id="audio-icon"></i>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
        </div>
    </div>

    <div class="view-counter">
        <i class="fas fa-eye"></i>
        <span id="view-count">0</span>
    </div>

    <div id="bg-image"></div>
    <div id="bg-overlay"></div>
    <canvas id="particle-canvas"></canvas>

    <div class="container" id="main-container">
        <div class="profile-pic-container">
            <img src="" alt="Profile" class="profile-pic" id="profile-pic" loading="eager">
        </div>
        <h1 class="name" id="name"></h1>
        <p class="tagline" id="tagline"></p>
        
        <div class="discord-badge" id="discord-badge">
            <i class="fab fa-discord"></i>
            <span id="discord-name"></span>
        </div>

        <div class="social-links" id="social-links"></div>
    </div>

    <audio id="bg-audio" loop></audio>

    <script>
        const CONFIG = {
            name: "xronla",
            tagline: "Steel kissed by shadows",
            discord: "vxmpscarlet",
            profilePic: "https://files.catbox.moe/8l9rww.jpg",
            backgroundImage: "https://files.catbox.moe/9xpjl0.jpg",
            introBackgroundImage: "https://files.catbox.moe/9xpjl0.jpg",
            audioFile: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
            links: [
                { icon: "fa-instagram", url: "https://instagram.com" },
                { icon: "fa-spotify", url: "https://spotify.com" },
                { img: "https://cdn-icons-png.flaticon.com/512/2504/2504914.png", url: "https://custom-link.com" },
                { icon: "fa-discord", url: "https://discord.com" }
            ]
        };

        document.title = CONFIG.name;
        const bgImg = document.getElementById('bg-image');
        const bgOverlay = document.getElementById('bg-overlay');
        const canvas = document.getElementById('particle-canvas');
        const introScreen = document.getElementById('intro-screen');
        const mountainBg = document.querySelector('.mountain-bg');
        const audio = document.getElementById('bg-audio');
        const audioIcon = document.getElementById('audio-icon');
        const volumeSlider = document.getElementById('volume-slider');

        mountainBg.style.backgroundImage = `url('${CONFIG.introBackgroundImage}')`;
        bgImg.style.backgroundImage = `url('${CONFIG.backgroundImage}')`;
        document.getElementById('profile-pic').src = CONFIG.profilePic;
        document.getElementById('name').innerText = CONFIG.name;
        document.getElementById('tagline').innerText = CONFIG.tagline;
        document.getElementById('discord-name').innerText = CONFIG.discord;

        let views = localStorage.getItem('page_views') || 42;
        views++;
        localStorage.setItem('page_views', views);
        document.getElementById('view-count').innerText = views;

        document.getElementById('discord-badge').addEventListener('click', () => {
            navigator.clipboard.writeText(CONFIG.discord);
            const badge = document.getElementById('discord-badge');
            const originalText = document.getElementById('discord-name').innerText;
            document.getElementById('discord-name').innerText = "Copied!";
            setTimeout(() => {
                document.getElementById('discord-name').innerText = originalText;
            }, 1500);
        });

        const socialContainer = document.getElementById('social-links');
        CONFIG.links.forEach(link => {
            const a = document.createElement('a');
            a.href = link.url;
            a.target = "_blank";
            a.className = "social-link";
            if (link.img) {
                a.innerHTML = `<img src="${link.img}" alt="icon">`;
            } else {
                a.innerHTML = `<i class="fab ${link.icon}"></i>`;
            }
            socialContainer.appendChild(a);
        });

        audio.src = CONFIG.audioFile;
        audio.volume = 0.5;
        let isPlaying = false;

        function updateAudioIcon() {
            if (audio.volume === 0) {
                audioIcon.className = 'fas fa-volume-mute';
            } else if (audio.volume < 0.4) {
                audioIcon.className = 'fas fa-volume-down';
            } else {
                audioIcon.className = 'fas fa-volume-up';
            }
        }

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
            updateAudioIcon();
            if (audio.volume > 0 && !isPlaying) {
                audio.play();
                isPlaying = true;
            }
        });

        document.getElementById('audio-toggle').addEventListener('click', (e) => {
            if (e.target.tagName !== 'INPUT') {
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                    audioIcon.className = 'fas fa-volume-mute';
                } else {
                    audio.play();
                    isPlaying = true;
                    updateAudioIcon();
                }
            }
        });

        introScreen.addEventListener('click', () => {
            introScreen.classList.add('pan-up');
            
            setTimeout(() => {
                introScreen.style.opacity = 0;
            }, 2500);

            setTimeout(() => {
                bgImg.style.opacity = 1;
                bgOverlay.style.opacity = 1;
                canvas.style.opacity = 1;
                document.body.classList.add('reveal');
                introScreen.style.display = 'none';
                
                if (CONFIG.audioFile) {
                    audio.play().then(() => {
                        isPlaying = true;
                        updateAudioIcon();
                    }).catch(() => {});
                }
            }, 3500);
        });

        const ctx = canvas.getContext('2d');
        let particlesArray = [];
        const particleCount = 75;

        function setCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        setCanvasSize();
        window.addEventListener('resize', setCanvasSize);

        class SpiritParticle {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height;
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 10;
                this.size = Math.random() * 2 + 0.5;
                this.speedY = Math.random() * -1.2 - 0.3;
                this.speedX = Math.random() * 1 - 0.5;
                this.opacity = Math.random() * 0.7 + 0.1;
                this.flicker = Math.random() * 0.03 + 0.01;
                this.color = Math.random() > 0.6 ? '200, 0, 0' : '255, 255, 255';
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.opacity -= this.flicker;
                
                if (this.y < -10 || this.opacity <= 0) {
                    this.reset();
                }
            }
            draw() {
                ctx.fillStyle = `rgba(${this.color}, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 15;
                ctx.shadowColor = `rgba(${this.color}, ${this.opacity * 2})`;
            }
        }

        function initParticles() {
            particlesArray = [];
            for (let i = 0; i < particleCount; i++) {
                particlesArray.push(new SpiritParticle());
            }
        }
        initParticles();

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.shadowBlur = 0;
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
