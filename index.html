<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100dvh;
            width: 100dvw;
            overflow: hidden;
            background-color: #050505;
            color: white;
            font-family: 'Rajdhani', sans-serif;
        }

        #bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100dvw;
            height: 100dvh;
            background-size: cover;
            background-position: center;
            filter: grayscale(100%) brightness(0.6) contrast(1.2);
            z-index: -2;
            opacity: 0;
            transition: opacity 2s ease;
        }

        #bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100dvw;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.9);
            z-index: -1;
            opacity: 0;
            transition: opacity 2s ease;
            pointer-events: none;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100dvw;
            height: 100dvh;
            z-index: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease;
        }

        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100dvw;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: #000;
            cursor: pointer;
            transition: opacity 1.5s ease;
        }

        .intro-text {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            letter-spacing: 8px;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            z-index: 101;
            pointer-events: none;
            animation: inferno 3s infinite alternate;
        }

        @keyframes inferno {
            0% { text-shadow: 0 0 10px rgba(255, 0, 0, 0.4), 0 0 20px rgba(255, 69, 0, 0.2); }
            100% { text-shadow: 0 0 15px rgba(255, 0, 0, 0.8), 0 0 30px rgba(255, 69, 0, 0.6), 0 0 45px rgba(255, 140, 0, 0.4); }
        }

        .flare {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle, rgba(255, 30, 0, 1) 0%, rgba(255, 0, 0, 0.8) 30%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            pointer-events: none;
            z-index: 102;
        }

        .flare.expand {
            animation: burn 1.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }

        @keyframes burn {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(300); opacity: 0; }
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            width: 100dvw;
            padding: 20px;
            text-align: center;
            z-index: 1;
            opacity: 0;
            transform: scale(0.98);
            transition: opacity 2s ease, transform 2s cubic-bezier(0.19, 1, 0.22, 1);
            pointer-events: none;
        }

        .reveal .container {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .profile-pic-container {
            position: relative;
            margin-bottom: 20px;
            padding: 4px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(139,0,0,0.3));
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            transition: box-shadow 0.4s ease;
        }

        .profile-pic-container:hover {
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.2);
        }

        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: 2px solid rgba(255, 255, 255, 0.8);
        }

        .name {
            font-family: 'Cinzel', serif;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 1), 0 0 20px rgba(255, 255, 255, 0.2);
            margin-bottom: 5px;
            color: #f0f0f0;
        }

        .tagline {
            font-size: 15px;
            font-weight: 500;
            color: #aaaaaa;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 1);
        }

        .discord-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .discord-badge::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .discord-badge:hover::before {
            left: 100%;
        }

        .discord-badge:hover {
            background: rgba(30, 30, 30, 0.8);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .discord-badge i {
            margin-right: 10px;
            color: #5865F2;
            font-size: 18px;
        }

        .social-links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 26px;
            transition: all 0.3s ease;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        .social-link img {
            width: 26px;
            height: 26px;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .social-link:hover {
            color: white;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            transform: translateY(-4px);
        }
        
        .social-link:hover img {
            transform: scale(1.1);
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.8));
        }

        .top-ui {
            position: absolute;
            top: 25px;
            left: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 8px;
            z-index: 10;
        }

        .audio-control {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .audio-control i {
            width: 20px;
            text-align: center;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 70px;
            background: transparent;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 10px;
            width: 10px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -3px;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        }

        .view-counter {
            position: absolute;
            bottom: 25px;
            left: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .view-counter i {
            font-size: 16px;
        }

        @media (max-width: 600px) {
            .name { font-size: 28px; }
            .tagline { font-size: 13px; }
            .profile-pic { width: 90px; height: 90px; }
            .social-link { font-size: 24px; }
            .intro-text { font-size: 16px; letter-spacing: 6px; }
            .top-ui { top: 15px; left: 15px; padding: 8px 12px; }
            .view-counter { bottom: 15px; left: 15px; }
        }
    </style>
</head>
<body>

    <div id="intro-screen">
        <div class="flare" id="flare"></div>
        <div class="intro-text">Click to enter...</div>
    </div>

    <div class="top-ui">
        <div class="audio-control" id="audio-toggle">
            <i class="fas fa-volume-up" id="audio-icon"></i>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
        </div>
    </div>

    <div class="view-counter">
        <i class="fas fa-eye"></i>
        <span id="view-count">0</span>
    </div>

    <div id="bg-image"></div>
    <div id="bg-overlay"></div>
    <canvas id="particle-canvas"></canvas>

    <div class="container" id="main-container">
        <div class="profile-pic-container">
            <img src="" alt="Profile" class="profile-pic" id="profile-pic" loading="eager">
        </div>
        <h1 class="name" id="name"></h1>
        <p class="tagline" id="tagline"></p>
        
        <div class="discord-badge" id="discord-badge">
            <i class="fab fa-discord"></i>
            <span id="discord-name"></span>
        </div>

        <div class="social-links" id="social-links"></div>
    </div>

    <audio id="bg-audio" loop></audio>

    <script>
        const CONFIG = {
            name: "xronla",
            tagline: "Steel kissed by shadows",
            discord: "vxmpscarlet",
            profilePic: "https://files.catbox.moe/8l9rww.jpg",
            backgroundImage: "https://files.catbox.moe/9xpjl0.jpg",
            audioFile: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
            links: [
                { icon: "fa-instagram", url: "https://instagram.com" },
                { icon: "fa-spotify", url: "https://spotify.com" },
                { img: "https://cdn-icons-png.flaticon.com/512/2504/2504914.png", url: "https://custom-link.com" },
                { icon: "fa-discord", url: "https://discord.com" }
            ]
        };

        document.title = CONFIG.name;
        const bgImg = document.getElementById('bg-image');
        const bgOverlay = document.getElementById('bg-overlay');
        const canvas = document.getElementById('particle-canvas');
        const introScreen = document.getElementById('intro-screen');
        const flare = document.getElementById('flare');
        const mainContainer = document.getElementById('main-container');
        const audio = document.getElementById('bg-audio');
        const audioIcon = document.getElementById('audio-icon');
        const volumeSlider = document.getElementById('volume-slider');

        bgImg.style.backgroundImage = `url('${CONFIG.backgroundImage}')`;
        document.getElementById('profile-pic').src = CONFIG.profilePic;
        document.getElementById('name').innerText = CONFIG.name;
        document.getElementById('tagline').innerText = CONFIG.tagline;
        document.getElementById('discord-name').innerText = CONFIG.discord;

        let views = localStorage.getItem('page_views') || 42;
        views++;
        localStorage.setItem('page_views', views);
        document.getElementById('view-count').innerText = views;

        document.getElementById('discord-badge').addEventListener('click', () => {
            navigator.clipboard.writeText(CONFIG.discord);
            const badge = document.getElementById('discord-badge');
            const originalText = document.getElementById('discord-name').innerText;
            document.getElementById('discord-name').innerText = "Copied!";
            setTimeout(() => {
                document.getElementById('discord-name').innerText = originalText;
            }, 1500);
        });

        const socialContainer = document.getElementById('social-links');
        CONFIG.links.forEach(link => {
            const a = document.createElement('a');
            a.href = link.url;
            a.target = "_blank";
            a.className = "social-link";
            if (link.img) {
                a.innerHTML = `<img src="${link.img}" alt="icon">`;
            } else {
                a.innerHTML = `<i class="fab ${link.icon}"></i>`;
            }
            socialContainer.appendChild(a);
        });

        audio.src = CONFIG.audioFile;
        audio.volume = 0.5;
        let isPlaying = false;

        function updateAudioIcon() {
            if (audio.volume === 0) {
                audioIcon.className = 'fas fa-volume-mute';
            } else if (audio.volume < 0.5) {
                audioIcon.className = 'fas fa-volume-down';
            } else {
                audioIcon.className = 'fas fa-volume-up';
            }
        }

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
            updateAudioIcon();
            if (audio.volume > 0 && !isPlaying) {
                audio.play();
                isPlaying = true;
            }
        });

        document.getElementById('audio-toggle').addEventListener('click', (e) => {
            if (e.target.tagName !== 'INPUT') {
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                    audioIcon.className = 'fas fa-volume-mute';
                } else {
                    audio.play();
                    isPlaying = true;
                    updateAudioIcon();
                }
            }
        });

        introScreen.addEventListener('click', () => {
            flare.classList.add('expand');
            introScreen.style.opacity = 0;
            
            setTimeout(() => {
                bgImg.style.opacity = 1;
                bgOverlay.style.opacity = 1;
                canvas.style.opacity = 1;
                document.body.classList.add('reveal');
                introScreen.style.display = 'none';
                
                if (CONFIG.audioFile) {
                    audio.play().then(() => {
                        isPlaying = true;
                        updateAudioIcon();
                    }).catch(() => {});
                }
            }, 600);
        });

        const ctx = canvas.getContext('2d');
        let particlesArray = [];
        const particleCount = 60;

        function setCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        setCanvasSize();
        window.addEventListener('resize', setCanvasSize);

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * -1 - 0.2;
                this.opacity = Math.random() * 0.5 + 0.1;
                this.color = Math.random() > 0.85 ? '255, 40, 40' : '255, 255, 255';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.y < 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = `rgba(${this.color}, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 10;
                ctx.shadowColor = `rgba(${this.color}, ${this.opacity * 2})`;
            }
        }

        function initParticles() {
            particlesArray = [];
            for (let i = 0; i < particleCount; i++) {
                particlesArray.push(new Particle());
            }
        }
        initParticles();

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.shadowBlur = 0;
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
