<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>xronla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Permanent+Marker&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--red:#c4170f;--ink:#e8e6e1;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:inherit;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:#030303;color:var(--ink);font-family:'Rajdhani',system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1px solid rgba(255,255,255,.7);outline-offset:4px}
.layer{position:fixed;inset:0;pointer-events:none}

/* ── Scene ── */
#plate{position:fixed;left:0;top:0;max-width:none;transform-origin:0 0;will-change:transform,filter;opacity:0;transition:opacity 1.8s ease}
.fog{z-index:1}
.fog i{position:absolute;inset:-25%;filter:blur(22px);animation:drift 40s linear infinite alternate;
background:radial-gradient(ellipse 38% 22% at 18% 62%,rgba(205,228,222,.42),transparent 70%),radial-gradient(ellipse 46% 20% at 78% 44%,rgba(190,215,210,.34),transparent 70%),radial-gradient(ellipse 60% 26% at 45% 82%,rgba(170,200,195,.4),transparent 72%)}
.fog.b i{animation-duration:58s;animation-direction:alternate-reverse;opacity:.65;transform:scaleX(-1)}
@keyframes drift{to{translate:14% 0;scale:1.1}}
#rays{z-index:2;opacity:0;mix-blend-mode:screen;
background:repeating-conic-gradient(from 186deg at 36% -12%,transparent 0 4deg,rgba(210,240,235,.17) 5deg 6.5deg,transparent 8deg 11deg);
-webkit-mask:linear-gradient(#000,transparent 78%);mask:linear-gradient(#000,transparent 78%)}
#fx{z-index:3;opacity:0;transition:opacity 2s ease}
#vig{z-index:4;background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,.34),rgba(0,0,0,.14) 42%,rgba(0,0,0,.9) 100%)}
#grain{z-index:5;inset:-50%;opacity:.1;mix-blend-mode:overlay;animation:grain .9s steps(5) infinite;
background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
@keyframes grain{20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}}
#flash{z-index:6;opacity:0;mix-blend-mode:screen;background:radial-gradient(circle at 50% 45%,#fff,rgba(200,240,235,.6) 35%,transparent 72%)}
body.ready #plate,body.ready #fx{opacity:1}

/* ── Letterbox ── */
.bar{position:fixed;left:0;right:0;height:0;background:#000;z-index:60;transition:height 1.2s cubic-bezier(.7,0,.2,1)}
.bar.t{top:0}.bar.d{bottom:0}
body.cine .bar{height:11dvh}
